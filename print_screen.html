<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Print Jobs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/print_screen_style.css">
</head>

<body>
    <h1>Print Jobs</h1>
    <div class="top-bar">
        <button aria-label="Print selected jobs" onclick="handlePrint()">
            <i class="fa-solid fa-print font-awesome-icons"></i> Print
        </button>

        <button aria-label="Delete selected jobs" onclick="alert('Jobs deleted successfully ❌')">
            <i class="fa-solid fa-trash font-awesome-icons"></i> Delete
        </button>

        <button aria-label="Deselect all jobs" onclick="alert('All jobs deselected ➖')">
            <i class="fa-solid fa-xmark font-awesome-icons"></i> Deselect Jobs
        </button>

        <button aria-label="Reprint selected jobs" onclick="alert('Reprint successful ✅')">
            <i class="fa-solid fa-rotate-right font-awesome-icons"></i> Reprint Jobs
        </button>

        <a href="preview.html" class="preview-primary" aria-label="Preview">
            <i class="fa-solid fa-magnifying-glass font-awesome-icons"></i> Preview
        </a>
    </div>

    <table aria-label="List of print jobs">

        <tr>
            <th>Job #</th>
            <th>Station ID</th>
            <th>User ID</th>
            <th>Color/Black & White</th>
            <th>Submitted</th>
            <th>Select</th>
        </tr>

        <tr>
            <td>1023</td>
            <td>ST-04</td>
            <td>4775</td>
            <td class="multi-color">Color: 5</td>
            <td>$1.25</td>
            <td><input type="checkbox" aria-label="Select Job 1023"></td>
        </tr>

        <tr>
            <td>1024</td>
            <td>ST-02</td>
            <td>4775</td>
            <td class="black-and-white">B&W: 12</td>
            <td>$3.00</td>
            <td><input type="checkbox" aria-label="Select Job 1024"></td>
        </tr>

        <tr>
            <td>1025</td>
            <td>ST-01</td>
            <td>4775</td>
            <td class="black-and-white">B&W: 8</td>
            <td>$2.00</td>
            <td><input type="checkbox" aria-label="Select Job 1025"></td>
        </tr>

    </table>

    <hr class="divider">

    <div class="totals-container">
        <span>Total Pages: 25</span>
        <span>Total Price: $6.25</span>
    </div>

    <div class="done-container">
        <a href="index.html" class="done-btn" aria-label="Finish and exit">
            <i class="fa-solid fa-circle-check font-awesome-icons"></i> Done
        </a>
    </div>
    <script src="js/print_logic.js"></script>
</body>

</html>
